<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генератор АОСР</title>
<style>
:root {
  --bg: #f5f6f8; --card: #ffffff; --text: #1d2430; --muted: #5d6675; --line: #d9dde4;
  --accent: #2f5597; --accent-soft: #e8eef8;
  --ok-bg: #edf7ee; --ok-line: #9fd0a5; --bad-bg: #fdf0ee; --bad-line: #eeb4aa; --mix-bg: #fdf7e8; --mix-line: #e6cf8f;
  --err: #b42318; --warn: #8a5a00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --card: #1d2128; --text: #e6e9ee; --muted: #9aa3b2; --line: #333a45;
    --accent: #6f9be0; --accent-soft: #233149;
    --ok-bg: #17271b; --ok-line: #2f5f38; --bad-bg: #2c1a18; --bad-line: #6b322a; --mix-bg: #2a2414; --mix-line: #6b5a26;
    --err: #ff8a7a; --warn: #e3b450;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --card: #1d2128; --text: #e6e9ee; --muted: #9aa3b2; --line: #333a45;
  --accent: #6f9be0; --accent-soft: #233149;
  --ok-bg: #17271b; --ok-line: #2f5f38; --bad-bg: #2c1a18; --bad-line: #6b322a; --mix-bg: #2a2414; --mix-line: #6b5a26;
  --err: #ff8a7a; --warn: #e3b450;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 40px 16px 48px; }
h1 { font-size: 24px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 24px; }
.drop { display: block; background: var(--card); border: 2px dashed var(--line); border-radius: 14px; padding: 48px 16px; text-align: center; cursor: pointer; transition: .15s; margin-bottom: 16px; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop strong { display: block; font-size: 18px; margin-bottom: 6px; }
.drop span { color: var(--muted); }
.drop input { display: none; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 8px 14px; cursor: pointer; }
button:hover { border-color: var(--accent); }
.links { color: var(--muted); font-size: 14px; text-align: center; }
.links button, .links label { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 14px; }
.links input { display: none; }
.report { border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; font: 13px/1.55 Consolas, "Cascadia Mono", monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.report.ok { background: var(--ok-bg); border: 1px solid var(--ok-line); }
.report.mixed { background: var(--mix-bg); border: 1px solid var(--mix-line); }
.report.bad { background: var(--bad-bg); border: 1px solid var(--bad-line); }
.report .e { color: var(--err); }
.report .w { color: var(--warn); }
.report .h { font-weight: 700; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>Генератор актов скрытых работ</h1>
  <p class="sub">Приложение Д к СН РК 1.03-00-2022 · работает без интернета, файлы никуда не отправляются</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept=".xlsx">
    <strong>Перетащите сюда заполненный реестр</strong>
    <span>или нажмите, чтобы выбрать файл .xlsx — скачается «Комплект_АОСР.docx»</span>
  </label>

  <div id="report" class="report" hidden></div>

  <div id="extra" class="card" hidden>
    <div class="row">
      <button id="dl-kit" type="button">Комплект ещё раз</button>
      <button id="dl-reg" type="button">Реестр ИД (Excel)</button>
      <button id="dl-rep" type="button">Отчёт проверки</button>
      <button id="dl-filled" type="button">Заполненный реестр</button>
      <button id="dl-acts" type="button">Акты по отдельности</button>
    </div>
  </div>

  <p class="links">
    <button id="sample" type="button">Скачать пустой реестр с примером</button> ·
    <button id="tpl-download" type="button">шаблон акта</button> ·
    <label>подключить свой шаблон<input type="file" id="tpl" accept=".docx"></label>
    <span id="tpl-name"></span>
  </p>
</main>
<script>/*LIB_XLSX*/</script>
<script>/*LIB_DT*/</script>
<script>/*DATA*/</script>
<script>/*APP*/</script>
</body>
</html>
